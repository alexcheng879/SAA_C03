<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>黑小萬高壓備餐產線系統</title>
    <style>
        :root {
            --bg-color: #f4f4f9;
            --card-bg: #ffffff;
            --primary-color: #2c3e50;
            --accent-color: #3498db;
            --cart-color: #e67e22;
            --done-color: #27ae60;
            --text-color: #333333;
            --border-radius: 8px;
        }
        body {
            font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, Helvetica, Arial, sans-serif;
            background-color: var(--bg-color); color: var(--text-color);
            margin: 0; padding: 15px; line-height: 1.6;
        }
        .container { max-width: 800px; margin: 0 auto; }
        h1 { text-align: center; color: var(--primary-color); margin-bottom: 20px; font-size: 1.5em; }
        
        .tabs { display: flex; justify-content: center; margin-bottom: 20px; background: #e0e0e0; border-radius: var(--border-radius); overflow: hidden; }
        .tab-btn { flex: 1; padding: 12px 8px; text-align: center; background: none; border: none; font-size: 1em; font-weight: bold; color: #666; cursor: pointer; transition: all 0.3s; }
        .tab-btn.active { background: var(--primary-color); color: white; }
        .view-section { display: none; }
        .view-section.active { display: block; }
        
        .week-section { background: var(--card-bg); border-radius: var(--border-radius); padding: 15px; margin-bottom: 20px; box-shadow: 0 2px 8px rgba(0,0,0,0.08); }
        
        #shopping-cart-panel { border: 2px solid var(--cart-color); background-color: #fff9f5; display: none; }
        .cart-header { display: flex; justify-content: space-between; align-items: center; margin-bottom: 10px; }
        .cart-title { color: var(--cart-color); margin: 0; font-size: 1.1em; font-weight: bold; }
        .clear-cart-btn { background: white; border: 1px solid var(--cart-color); color: var(--cart-color); padding: 4px 10px; border-radius: 4px; cursor: pointer; font-size: 0.9em; }
        .cart-category { margin-bottom: 8px; font-size: 0.95em; }
        .cart-category strong { color: white; background: var(--cart-color); padding: 2px 6px; border-radius: 4px; margin-right: 8px; font-size: 0.9em; }

        .week-header { display: flex; justify-content: space-between; align-items: center; border-bottom: 1px solid #eee; padding-bottom: 10px; margin-bottom: 10px; }
        .week-title { color: var(--accent-color); margin: 0; font-size: 1.2em; font-weight: bold; }
        .mini-btn { background: #fff3e0; color: #d35400; border: 1px solid #f39c12; padding: 4px 10px; border-radius: 15px; font-size: 0.85em; cursor: pointer; font-weight: bold; }

        .recipe-list { list-style: none; padding: 0; margin: 0; }
        .recipe-item { display: flex; align-items: flex-start; padding: 12px 0; border-bottom: 1px dashed #e0e0e0; }
        .recipe-item:last-child { border-bottom: none; }
        
        .action-group { display: flex; gap: 10px; margin-right: 12px; padding-top: 2px; }
        .custom-checkbox { display: flex; flex-direction: column; align-items: center; cursor: pointer; font-size: 0.75em; color: #7f8c8d; user-select: none; }
        .custom-checkbox input { width: 22px; height: 22px; margin-bottom: 2px; cursor: pointer; }
        .cart-box { accent-color: var(--cart-color); }
        .done-box { accent-color: var(--done-color); }

        .recipe-content { flex-grow: 1; }
        .recipe-name { font-weight: bold; font-size: 1.05em; margin-bottom: 4px; }
        .recipe-meta { font-size: 0.85em; color: #666; line-height: 1.4; }
        .tag { display: inline-block; padding: 2px 6px; border-radius: 12px; font-size: 0.8em; margin-right: 6px; font-weight: bold; }
        .tag-chill { background-color: #e8f4fd; color: #2980b9; border: 1px solid #bce0fd; }
        .tag-freeze { background-color: #f0fdf4; color: #27ae60; border: 1px solid #bbf7d0; }
        
        .recipe-item.is-done .recipe-name { color: #999; text-decoration: line-through; }
        
        .progress-bar { background-color: #e0e0e0; height: 6px; border-radius: 3px; margin-top: 10px; overflow: hidden; }
        .progress-fill { background-color: var(--done-color); height: 100%; width: 0%; transition: width 0.3s; }

        /* 食譜展開樣式 */
        .toggle-btn {
            background: #f1f2f6; border: 1px solid #dfe4ea; padding: 4px 10px; border-radius: 12px;
            font-size: 0.85em; cursor: pointer; color: #2f3542; margin-top: 6px;
            display: inline-flex; align-items: center; font-weight: bold; user-select: none;
        }
        .recipe-steps {
            display: none; background: #fafbfc; border-left: 3px solid var(--accent-color);
            padding: 10px 12px; margin-top: 10px; border-radius: 0 6px 6px 0; font-size: 0.9em; color: #444;
        }
        .recipe-steps.active { display: block; animation: fadeIn 0.2s ease-in-out; }
        
        /* 份量區塊樣式 */
        .recipe-amounts {
            background: #ffffff; border: 1px dashed #ced6e0; border-radius: 4px;
            padding: 8px 10px; margin-bottom: 10px; font-size: 0.95em;
        }
        .recipe-amounts div { margin-bottom: 4px; }
        .recipe-amounts div:last-child { margin-bottom: 0; }
        .recipe-amounts strong { color: #d35400; }

        .recipe-steps ol { margin: 0; padding-left: 20px; }
        .recipe-steps li { margin-bottom: 6px; line-height: 1.5; }
        .recipe-steps strong { color: var(--primary-color); }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(-5px); } to { opacity: 1; transform: translateY(0); } }

        /* 食材盤點樣式 */
        .ingredient-group { margin-bottom: 12px; }
        .ingredient-group-title { font-size: 0.95em; color: #555; margin-bottom: 8px; font-weight: bold; }
        .ingredient-tag { display: inline-block; padding: 6px 12px; margin: 0 6px 8px 0; background: #fff; border: 1px solid #ccc; border-radius: 20px; cursor: pointer; font-size: 0.9em; user-select: none; }
        .ingredient-tag.selected { background: var(--accent-color); color: white; border-color: var(--accent-color); }
        .match-card { background: white; padding: 15px; border-radius: var(--border-radius); margin-bottom: 12px; border-left: 4px solid var(--accent-color); box-shadow: 0 2px 6px rgba(0,0,0,0.06); }
        .match-score { font-size: 0.8em; color: #e74c3c; font-weight: bold; margin-bottom: 6px; display: inline-block; background: #fdf2f0; padding: 3px 8px; border-radius: 4px; }
        .empty-state { text-align: center; color: #888; padding: 30px; background: white; border-radius: var(--border-radius); font-size: 0.95em; }
    </style>
</head>
<body>

<div class="container">
    <h1>黑小萬備餐產線系統</h1>
    
    <div class="tabs">
        <button class="tab-btn active" onclick="switchTab('pipeline')">📅 本週產線</button>
        <button class="tab-btn" onclick="switchTab('matcher')">🔍 食材盤點</button>
    </div>

    <div id="pipeline-view" class="view-section active">
        <div id="shopping-cart-panel" class="week-section">
            <div class="cart-header">
                <h2 class="cart-title">🛒 採購清單</h2>
                <button class="clear-cart-btn" onclick="clearCart()">清空勾選</button>
            </div>
            <div id="cart-content"></div>
        </div>
        <div id="app"></div>
    </div>

    <div id="matcher-view" class="view-section">
        <div class="week-section">
            <h2 class="week-title" style="border-bottom: 1px solid #eee; padding-bottom: 10px;">點選剩下的食材</h2>
            <div id="ingredients-container"></div>
        </div>
        <div id="match-results">
            <div class="empty-state">請上方點選食材，系統將自動匹配料理。</div>
        </div>
    </div>
</div>

<script>
// 資料庫 (新增 amtIng 食材份量 與 amtSea 調味料比例)
const pipelineData = [
    {
        week: "第一週",
        recipes: [
            { id: "w1-1", name: "味噌鮭魚根莖湯", type: "chill", typeLabel: "冷藏消耗", details: "鮭魚塊、紅白蘿蔔丁、嫩豆腐", ingredients: ["鮭魚", "紅蘿蔔", "白蘿蔔", "豆腐"],
              amtIng: "鮭魚塊 150g、紅蘿蔔半根、白蘿蔔 100g、嫩豆腐 1盒", amtSea: "低鈉味噌 1.5大匙、水 600ml",
              steps: ["紅白蘿蔔切極小的丁，鮭魚切塊，豆腐切小丁。", "蘿蔔丁與水下鍋，選擇「煮湯」模式。", "排氣開蓋後，加入鮭魚與豆腐，選「烤肉/開蓋烹調」模式煮滾 5 分鐘。", "關火，將味噌放入濾網中拌勻化開。"] },
            { id: "w1-2", name: "番茄無水燉牛肉", type: "chill", typeLabel: "冷藏消耗", details: "牛肋條、番茄塊、洋蔥、紅蘿蔔", ingredients: ["牛肉", "番茄", "洋蔥", "紅蘿蔔"],
              amtIng: "牛肋條 300g、大番茄 4顆、洋蔥半顆、紅蘿蔔半根", amtSea: "薄鹽醬油 1.5大匙、冰糖 1小匙 (完全不加水)",
              steps: ["牛肋條切 1.5 公分小塊（沖熱水去血水），番茄、紅蘿蔔、洋蔥切塊。", "內鍋底先鋪番茄，疊上洋蔥、紅蘿蔔，最上層放牛肉。", "淋入調味料，選擇「密封燉-牛肉/羊肉」。", "排氣開蓋後，將糊化的番茄與牛肉拌勻。"] },
            { id: "w1-3", name: "雙菇玉米筍燉牛肉", type: "freeze", typeLabel: "冷凍冰磚", details: "牛絞肉、雪白菇/金針菇/玉米筍", ingredients: ["牛肉", "菇類", "玉米筍"],
              amtIng: "牛絞肉 250g、雪白菇 1包、金針菇半包、玉米筍 4根", amtSea: "薄鹽醬油 2大匙、糖 0.5小匙、水 100ml",
              steps: ["將所有菇類、玉米筍全部切至「接近米粒大小」。", "牛絞肉與碎蔬菜、調味料及水拌勻下鍋。", "選擇「密封燉-牛肉/羊肉」。", "開蓋後拌勻，蔬菜視覺已完全與絞肉融合。"] },
            { id: "w1-4", name: "南瓜奶香雞腿燉飯", type: "freeze", typeLabel: "冷凍冰磚", details: "去骨雞腿丁、南瓜塊、鮮奶", ingredients: ["雞肉", "南瓜", "鮮奶"],
              amtIng: "去骨雞腿肉 200g、南瓜 200g、白米 1.5杯", amtSea: "鮮奶 0.5杯、水 1杯、無鹽奶油 10g、鹽巴 0.5小匙",
              steps: ["雞腿肉切極小丁，南瓜去皮切塊。", "白米洗淨放內鍋，加入水與鮮奶。", "鋪上南瓜塊與雞肉丁。選擇「米飯」模式。", "開蓋後趁熱加入奶油與鹽巴，用飯匙將南瓜徹底壓成泥與米飯拌勻。"] },
            { id: "w1-5", name: "玉米牛奶洋蔥燉雞", type: "freeze", typeLabel: "冷凍冰磚", details: "雞胸肉丁、玉米粒、洋蔥碎", ingredients: ["雞肉", "玉米粒", "洋蔥", "鮮奶"],
              amtIng: "雞胸肉 200g、生甜玉米粒 150g、洋蔥半顆", amtSea: "鮮奶 200ml、水 100ml、無鹽奶油 10g、鹽巴 0.5小匙",
              steps: ["雞胸肉切極小丁，洋蔥切細碎。", "雞肉、玉米、洋蔥與水下鍋。選擇「密封燉-雞肉」。", "開蓋後加入鮮奶與奶油，選「烤肉/開蓋烹調」微滾2分鐘(勿大滾以免分離)。", "拌入鹽巴，口感如西式濃湯。"] }
        ]
    },
    {
        week: "第二週",
        recipes: [
            { id: "w2-1", name: "番茄豆腐滑肉煲", type: "chill", typeLabel: "冷藏消耗", details: "豬里肌碎、番茄塊、嫩豆腐、雞蛋", ingredients: ["豬肉", "番茄", "豆腐", "雞蛋"],
              amtIng: "豬里肌薄片 150g、大番茄 3顆、嫩豆腐 1盒、雞蛋 1顆", amtSea: "番茄醬 1小匙、薄鹽醬油 1小匙、太白粉少許",
              steps: ["豬肉切碎，用少許水與太白粉抓勻。番茄切碎，豆腐切丁。", "番茄與豆腐入鍋，不加水，選擇「密封燉-豆類/蹄筋」。", "開蓋後轉「烤肉/開蓋烹調」模式讓番茄原汁滾起。", "放入肉片攪散燙熟，關火前淋上打散的蛋液與調味料。"] },
            { id: "w2-2", name: "蘋果洋蔥燉梅花豬", type: "chill", typeLabel: "冷藏消耗", details: "梅花豬塊、蘋果塊、洋蔥塊", ingredients: ["豬肉", "蘋果", "洋蔥"],
              amtIng: "梅花豬肉塊 300g、蘋果 1顆、洋蔥 1顆", amtSea: "薄鹽醬油 2大匙、水 50ml",
              steps: ["蘋果去皮去籽切塊，洋蔥切大塊，豬肉切2公分塊。", "全部食材入鍋，淋上醬油與水。", "選擇「密封燉-豬排/排骨」。", "開蓋後蘋果已軟爛，拌入肉汁中淋飯非常鮮甜。"] },
            { id: "w2-3", name: "滷肉燥與滷紅蘿蔔", type: "freeze", typeLabel: "冷凍冰磚", details: "豬絞肉、紅蘿蔔丁、水煮蛋", ingredients: ["豬肉", "紅蘿蔔", "雞蛋"],
              amtIng: "帶皮豬五花絞肉 300g、紅蘿蔔 1大根、水煮蛋 3顆", amtSea: "薄鹽醬油 3大匙、冰糖 1大匙、水 300ml",
              steps: ["紅蘿蔔切小丁。", "絞肉、紅蘿蔔、去殼水煮蛋入鍋，加入調味料與水。", "選擇「密封燉-豬排/排骨」。", "肉汁膠質豐富，紅蘿蔔吸滿滷汁甜味無生味。"] },
            { id: "w2-4", name: "地瓜毛豆燉豬軟骨", type: "freeze", typeLabel: "冷凍冰磚", details: "豬軟骨排、黃地瓜塊、毛豆仁", ingredients: ["豬肉", "地瓜", "毛豆"],
              amtIng: "豬軟骨排 300g、黃地瓜 1條 (約200g)、冷凍毛豆仁 50g", amtSea: "薄鹽醬油 1.5大匙、水 200ml",
              steps: ["豬軟骨川燙去血水，地瓜去皮切塊。", "將排骨、地瓜與醬油、水入鍋，選擇「密封燉-豆類/蹄筋」。", "排氣開蓋後，趁熱拌入解凍的毛豆仁，蓋上鍋蓋利用餘溫悶3分鐘即可。"] },
            { id: "w2-5", name: "茄汁鯖魚燉洋蔥", type: "freeze", typeLabel: "冷凍冰磚", details: "無刺鯖魚塊、番茄碎、洋蔥碎", ingredients: ["鯖魚", "番茄", "洋蔥"],
              amtIng: "無刺鯖魚片 2片 (約200g)、大番茄 3顆、洋蔥半顆", amtSea: "番茄醬 1大匙、糖 0.5小匙 (不加水)",
              steps: ["鯖魚切塊，番茄與洋蔥切細碎。", "內鍋底鋪番茄，疊上洋蔥與鯖魚塊，加入番茄醬與糖。", "選擇「密封燉-魚肉」。", "開蓋後用飯匙將魚肉輕輕壓碎(挑查暗刺)，拌勻收汁。"] }
        ]

    {
        week: "第三週",
        recipes: [
            { id: "w3-1", name: "香菇鱈魚豆腐炊飯", type: "chill", typeLabel: "冷藏消耗", details: "鱈魚片、鮮香菇碎、嫩豆腐丁", ingredients: ["鱈魚", "菇類", "豆腐"],
              amtIng: "無刺鱈魚片 1片 (約150g)、鮮香菇 2朵、嫩豆腐半盒、白米 1.5杯", amtSea: "薄鹽醬油 1大匙、水 1.3杯、冷壓芝麻香油 1小匙",
              steps: ["香菇切極碎，豆腐切小丁。", "白米洗淨加水(豆腐會出水，故水量略減)，拌入醬油。", "鋪上香菇、豆腐丁，最上方放鱈魚片。選擇「米飯」模式。", "開蓋後將鱈魚壓碎拌勻，起鍋前滴入芝麻香油。"] },
            { id: "w3-2", name: "番茄肉醬洋芋泥", type: "chill", typeLabel: "冷藏消耗", details: "牛豬絞肉、番茄塊、馬鈴薯", ingredients: ["牛肉", "豬肉", "番茄", "馬鈴薯"],
              amtIng: "豬/牛混合絞肉 250g、大番茄 3顆、馬鈴薯 2顆、洋蔥 1/4顆", amtSea: "番茄醬 1大匙、鹽巴 0.5小匙 (不加水)",
              steps: ["番茄與馬鈴薯去皮切小塊(馬鈴薯需先微波殺青)，洋蔥切極碎。", "全食材與絞肉入鍋，加入調味料。", "選擇「密封燉-豆類/蹄筋」。", "開蓋後直接用湯勺將極軟爛的馬鈴薯壓成泥，與肉醬融合。"] },
            { id: "w3-3", name: "蘿蔔牛腩咖哩 (無辣)", type: "freeze", typeLabel: "冷凍冰磚", details: "牛腩塊、紅蘿蔔丁、馬鈴薯、蘋果泥", ingredients: ["牛肉", "紅蘿蔔", "馬鈴薯", "蘋果"],
              amtIng: "牛腩 250g、紅蘿蔔 1根、馬鈴薯 1顆、蘋果半顆", amtSea: "幼兒專用蘋果咖哩塊 2小塊、水 400ml",
              steps: ["牛腩切1.5公分小塊燙過，紅白蘿蔔、馬鈴薯切丁(殺青)，蘋果磨泥。", "咖哩塊除外，其餘全食材與水入鍋，選擇「密封燉-牛肉/羊肉」。", "開蓋後，放入咖哩塊攪拌融化。", "蓋上鍋蓋利用餘溫再悶 5 分鐘。"] },
            { id: "w3-4", name: "芋頭香菇肉末粥", type: "freeze", typeLabel: "冷凍冰磚", details: "豬絞肉、芋頭塊、乾香菇碎", ingredients: ["豬肉", "芋頭", "菇類"],
              amtIng: "豬絞肉 150g、芋頭 200g、乾香菇 2朵 (泡軟)、白米 0.5杯", amtSea: "薄鹽醬油 1小匙、水 4杯",
              steps: ["芋頭切小塊，香菇切極碎。絞肉用水微抓打散。", "將白米、絞肉、芋頭塊、香菇碎與水、醬油入鍋。", "選擇「煮粥」模式。", "開蓋後芋頭已完全糊化，攪拌均勻。"] },
            { id: "w3-5", name: "栗子香菇燒雞", type: "freeze", typeLabel: "冷凍冰磚", details: "雞腿肉丁、生鮮栗子、鮮香菇、紅蘿蔔", ingredients: ["雞肉", "栗子", "菇類", "紅蘿蔔"],
              amtIng: "去骨雞腿肉 250g、生鮮去殼栗子 100g、鮮香菇 3朵、紅蘿蔔半根", amtSea: "薄鹽醬油 1.5大匙、糖 0.5小匙、水 100ml",
              steps: ["雞腿肉切小丁，鮮香菇切碎，紅蘿蔔切小塊。", "全食材下鍋，加入醬油、糖與水。", "選擇「密封燉-雞肉/鴨肉」。", "開蓋後栗子極度鬆軟，用湯匙微壓碎與肉汁混合。"] }
        ]
    },
    {
        week: "第四週",
        recipes: [
            { id: "w4-1", name: "櫛瓜蛤蜊去骨排骨湯", type: "chill", typeLabel: "冷藏消耗", details: "豬軟骨排、去皮櫛瓜、蛤蜊", ingredients: ["豬肉", "櫛瓜", "蛤蜊"],
              amtIng: "豬軟骨排 250g、蛤蜊 200g (吐沙完畢)、櫛瓜 1根、薑 1小片", amtSea: "鹽巴 0.5小匙、水 600ml",
              steps: ["軟骨排川燙，櫛瓜去皮切厚片(去皮消滅蔬菜感)。", "排骨、櫛瓜、薑片與水入鍋。選擇「煮湯」模式。", "排氣開蓋後，趁滾熱放入蛤蜊，蓋上鍋蓋悶3分鐘至開殼。", "加鹽調味，櫛瓜已化為透明軟質地。"] },
            { id: "w4-2", name: "雙層玉米筍蒸肉餅", type: "chill", typeLabel: "冷藏消耗", details: "豬絞肉、玉米筍薄片、雞蛋", ingredients: ["豬肉", "玉米筍", "雞蛋"],
              amtIng: "豬絞肉 250g、玉米筍 4根、雞蛋 1顆", amtSea: "薄鹽醬油 1小匙、香油 1小匙、水 2大匙",
              steps: ["玉米筍切極薄的薄片。", "絞肉與雞蛋、調味料、水同方向持續攪拌出黏性。", "肉泥平鋪在深盤，表面密麻鋪滿玉米筍薄片。", "鍋內加1杯水放蒸架，選「蒸煮」模式 15 分鐘。"] },
            { id: "w4-3", name: "鮭魚鴻禧菇炊飯", type: "freeze", typeLabel: "冷凍冰磚", details: "鮭魚菲力、鴻禧菇碎、玉米筍碎", ingredients: ["鮭魚", "菇類", "玉米筍"],
              amtIng: "鮭魚菲力 150g、鴻禧菇半包、玉米筍 4根、白米 1.5杯", amtSea: "薄鹽醬油 1大匙、味醂 1小匙、水 1.5杯",
              steps: ["鴻禧菇與玉米筍切至極碎。", "白米洗淨加水，拌入醬油、味醂。", "鋪上碎菇、玉米筍，最上方放鮭魚。選擇「米飯」模式。", "開蓋壓碎鮭魚，挑出殘留暗刺拌勻。"] },
            { id: "w4-4", name: "南瓜起司豬肉濃湯", type: "freeze", typeLabel: "冷凍冰磚", details: "豬絞肉、南瓜塊、鮮奶/起司", ingredients: ["豬肉", "南瓜", "鮮奶", "起司"],
              amtIng: "豬絞肉 150g、南瓜 300g", amtSea: "鮮奶 200ml、水 150ml、天然起司片 1片、鹽巴微量",
              steps: ["南瓜去皮切小塊。", "南瓜、絞肉、水入鍋，選擇「煮湯」模式。", "開蓋後南瓜已糊化，加入鮮奶與起司片。", "轉「烤肉/開蓋烹調」模式微滾融化起司，加微量鹽巴拌勻。"] },
            { id: "w4-5", name: "奶油蘑菇雞肉燉飯", type: "freeze", typeLabel: "冷凍冰磚", details: "雞腿肉碎、蘑菇碎、洋蔥碎", ingredients: ["雞肉", "菇類", "洋蔥"],
              amtIng: "去骨雞腿肉 200g、蘑菇 1盒、洋蔥 1/4顆、白米 1.5杯", amtSea: "鮮奶 0.5杯、水 1杯、無鹽奶油 15g、鹽巴 0.5小匙",
              steps: ["雞腿切小丁，蘑菇與洋蔥切極碎。", "白米洗淨加水與鮮奶。鋪上洋蔥、蘑菇碎與雞肉丁。", "選擇「米飯」模式。", "開蓋後趁熱加入奶油與鹽巴拌勻。"] }
        ]
    }
];

const ingredientCategories = {
    "蛋白質主力": ["牛肉", "豬肉", "雞肉", "鮭魚", "鱈魚", "鯖魚", "蛤蜊", "雞蛋", "豆腐"],
    "根莖瓜果": ["番茄", "紅蘿蔔", "白蘿蔔", "洋蔥", "馬鈴薯", "地瓜", "南瓜", "芋頭", "櫛瓜", "蘋果"],
    "配菜與其他": ["菇類", "玉米筍", "玉米粒", "毛豆", "栗子", "鮮奶", "起司"]
};

const appContainer = document.getElementById('app');
const cartPanel = document.getElementById('shopping-cart-panel');
const cartContent = document.getElementById('cart-content');
const ingredientsContainer = document.getElementById('ingredients-container');
const matchResults = document.getElementById('match-results');
let selectedIngredients = new Set();

function switchTab(tabId) {
    document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
    document.querySelectorAll('.view-section').forEach(sec => sec.classList.remove('active'));
    event.currentTarget.classList.add('active');
    document.getElementById(tabId + '-view').classList.add('active');
}

function toggleSteps(stepId) {
    const stepDiv = document.getElementById(stepId);
    if (stepDiv.classList.contains('active')) {
        stepDiv.classList.remove('active');
    } else {
        stepDiv.classList.add('active');
    }
}

function generateStepsHTML(recipe, idPrefix) {
    let listHTML = recipe.steps.map(s => `<li>${s}</li>`).join('');
    return `
        <button class="toggle-btn" onclick="toggleSteps('${idPrefix}')">📖 食材與步驟</button>
        <div id="${idPrefix}" class="recipe-steps">
            <div class="recipe-amounts">
                <div><strong>食材：</strong>${recipe.amtIng}</div>
                <div><strong>調味：</strong>${recipe.amtSea}</div>
            </div>
            <ol>${listHTML}</ol>
        </div>
    `;
}

// ---------------- 模組 1: 備餐產線 ----------------
function renderPipeline() {
    appContainer.innerHTML = '';
    pipelineData.forEach((weekData, weekIndex) => {
        const weekSection = document.createElement('div');
        weekSection.className = 'week-section';
        
        const header = document.createElement('div');
        header.className = 'week-header';
        header.innerHTML = `<h2 class="week-title">${weekData.week}</h2><button class="mini-btn" onclick="selectAllCart(${weekIndex})">🛒 全選本週</button>`;
        
        const progressBarContainer = document.createElement('div');
        progressBarContainer.className = 'progress-bar';
        const progressFill = document.createElement('div');
        progressFill.className = 'progress-fill';
        progressFill.id = `progress-${weekIndex}`;
        progressBarContainer.appendChild(progressFill);
        
        const recipeList = document.createElement('ul');
        recipeList.className = 'recipe-list';
        
        weekData.recipes.forEach(recipe => {
            const isCart = localStorage.getItem(`cart_${recipe.id}`) === 'true';
            const isDone = localStorage.getItem(`done_${recipe.id}`) === 'true';
            const li = document.createElement('li');
            li.className = `recipe-item ${isDone ? 'is-done' : ''}`;
            const tagClass = recipe.type === 'chill' ? 'tag-chill' : 'tag-freeze';
            
            li.innerHTML = `
                <div class="action-group">
                    <label class="custom-checkbox"><input type="checkbox" class="cart-box" data-id="${recipe.id}" ${isCart ? 'checked' : ''}><span>買</span></label>
                    <label class="custom-checkbox"><input type="checkbox" class="done-box" data-id="${recipe.id}" ${isDone ? 'checked' : ''}><span>煮</span></label>
                </div>
                <div class="recipe-content">
                    <div class="recipe-name">${recipe.name}</div>
                    <div class="recipe-meta"><span class="tag ${tagClass}">${recipe.typeLabel}</span>${recipe.details}</div>
                    ${generateStepsHTML(recipe, `step-${recipe.id}`)}
                </div>
            `;
            
            li.querySelector('.cart-box').addEventListener('change', (e) => { localStorage.setItem(`cart_${recipe.id}`, e.target.checked); renderShoppingCart(); });
            li.querySelector('.done-box').addEventListener('change', (e) => {
                localStorage.setItem(`done_${recipe.id}`, e.target.checked);
                if (e.target.checked) li.classList.add('is-done'); else li.classList.remove('is-done');
                updateProgress(weekIndex, weekData.recipes);
            });
            recipeList.appendChild(li);
        });
        
        weekSection.appendChild(header);
        weekSection.appendChild(recipeList);
        weekSection.appendChild(progressBarContainer);
        appContainer.appendChild(weekSection);
        
        updateProgress(weekIndex, weekData.recipes);
    });
    renderShoppingCart();
}

function updateProgress(weekIndex, recipes) {
    let completed = recipes.filter(r => localStorage.getItem(`done_${r.id}`) === 'true').length;
    document.getElementById(`progress-${weekIndex}`).style.width = `${(completed / recipes.length) * 100}%`;
}

function selectAllCart(weekIndex) {
    pipelineData[weekIndex].recipes.forEach(r => localStorage.setItem(`cart_${r.id}`, 'true'));
    renderPipeline();
}

function clearCart() {
    pipelineData.forEach(w => w.recipes.forEach(r => localStorage.removeItem(`cart_${r.id}`)));
    renderPipeline();
}

function renderShoppingCart() {
    let hasItems = false;
    const ingredientCounts = {};
    pipelineData.forEach(w => w.recipes.forEach(r => {
        if (localStorage.getItem(`cart_${r.id}`) === 'true') {
            hasItems = true;
            r.ingredients.forEach(ing => ingredientCounts[ing] = (ingredientCounts[ing] || 0) + 1);
        }
    }));

    if (!hasItems) { cartPanel.style.display = 'none'; return; }
    cartPanel.style.display = 'block';

    const categorized = { "蛋白質主力": {}, "根莖瓜果": {}, "配菜與其他": {}, "未分類": {} };
    for (const [ing, count] of Object.entries(ingredientCounts)) {
        let found = false;
        for (const [cat, items] of Object.entries(ingredientCategories)) {
            if (items.includes(ing)) { categorized[cat][ing] = count; found = true; break; }
        }
        if (!found) categorized["未分類"][ing] = count;
    }

    let html = '';
    for (const [cat, itemsObj] of Object.entries(categorized)) {
        const entries = Object.entries(itemsObj);
        if (entries.length > 0) {
            html += `<div class="cart-category"><strong>${cat}</strong> ` + 
                    entries.map(([n, q]) => q > 1 ? `${n}(x${q})` : n).join('、 ') + `</div>`;
        }
    }
    cartContent.innerHTML = html;
}

// ---------------- 模組 2: 食材盤點 ----------------
function renderIngredientsList() {
    ingredientsContainer.innerHTML = '';
    for (const [category, items] of Object.entries(ingredientCategories)) {
        const groupDiv = document.createElement('div');
        groupDiv.className = 'ingredient-group';
        groupDiv.innerHTML = `<div class="ingredient-group-title">${category}</div>`;
        items.forEach(item => {
            const tag = document.createElement('span');
            tag.className = 'ingredient-tag';
            tag.innerText = item;
            tag.onclick = () => {
                if (selectedIngredients.has(item)) { selectedIngredients.delete(item); tag.classList.remove('selected'); }
                else { selectedIngredients.add(item); tag.classList.add('selected'); }
                calculateMatches();
            };
            groupDiv.appendChild(tag);
        });
        ingredientsContainer.appendChild(groupDiv);
    }
}

function calculateMatches() {
    if (selectedIngredients.size === 0) {
        matchResults.innerHTML = '<div class="empty-state">請上方點選食材，系統將自動匹配料理。</div>';
        return;
    }

    let allRecipes = [];
    pipelineData.forEach(w => w.recipes.forEach(r => {
        let matchCount = 0;
        r.ingredients.forEach(ing => { if (selectedIngredients.has(ing)) matchCount++; });
        if (matchCount > 0) allRecipes.push({ ...r, matchCount: matchCount, totalIng: r.ingredients.length });
    }));

    allRecipes.sort((a, b) => b.matchCount - a.matchCount || a.totalIng - b.totalIng);

    if (allRecipes.length === 0) {
        matchResults.innerHTML = '<div class="empty-state">沒有完全符合的料理組合，請嘗試其他食材。</div>';
        return;
    }

    matchResults.innerHTML = '';
    allRecipes.forEach((recipe, index) => {
        const card = document.createElement('div');
        card.className = 'match-card';
        const isReady = recipe.matchCount === recipe.totalIng;
        card.innerHTML = `
            <div class="match-score">${isReady ? '✅ 完美匹配 (食材齊全)' : `🔍 匹配 ${recipe.matchCount}/${recipe.totalIng} 項`}</div>
            <div class="recipe-name">${recipe.name}</div>
            <div class="recipe-meta" style="margin-bottom: 5px;">食材: <b>${recipe.ingredients.join('、')}</b></div>
            ${generateStepsHTML(recipe, `match-step-${index}`)}
        `;
        matchResults.appendChild(card);
    });
}

renderPipeline();
renderIngredientsList();
</script>
